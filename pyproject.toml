[project]
name = "tech-stock-digest"
version = "0.1.0"
description = "Mistral Workflow that reads Yahoo Finance, summarizes tech stock news, and emails a digest with a short podcast audio"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.18.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/worker/src"]
testpaths = ["tests"]
